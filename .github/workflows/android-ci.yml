name: Android CI

on:
  pull_request:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-release-build:
    name: Unit tests + release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The release APK stays unsigned here: signing secrets are only used by the tag release workflow.
      # assembleRelease also runs R8 and lint vital checks.
      - name: Unit tests and release build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease --warning-mode all

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
